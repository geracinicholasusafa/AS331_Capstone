; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Build in a short folder outside OneDrive. The project's OneDrive path is so long that the IMU library's
; example files go past Windows' 260-character path limit, which made library installs (and uploads) fail.
workspace_dir = ${sysenv.USERPROFILE}/pio_ws

[env:esp32thing_plus]
framework = arduino
platform = espressif32
board = sparkfun_esp32s2_thing_plus_c
upload_speed = 115200   ; slow and safe: avoids "MD5 of the file does not match data in flash" on flaky USB links
lib_deps = 
	greiman/SdFat@^2.3.1
	sparkfun/SparkFun MAX1704x Fuel Gauge Arduino Library@^1.0.3
	sparkfun/SparkFun 9DoF IMU Breakout - ICM 20948 - Arduino Library@^1.3.2
	meelonusk/TB9051FTGMotorCarrier@^1.0.2
	madhephaestus/ESP32Encoder@^0.12.0
	adafruit/Adafruit MAX31855 library@^1.4.2
